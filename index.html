<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>劦成｜紙箱展開圖</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">劦成</div>
      <div><strong>紙箱展開圖</strong><div class="sub">A1 外印刷作圖模板</div></div>
    </div>
  </header>

  <main>
    <div id="err" class="error" role="alert" hidden></div>

    <div class="layoutGrid">
      <section class="card controls" aria-labelledby="settings-title">
        <h1 id="settings-title">紙箱尺寸</h1>
        <p class="sectionIntro">輸入尺寸後，右側展開圖會即時更新。</p>

        <fieldset>
          <legend class="srOnly">紙箱尺寸，單位毫米</legend>
          <div class="dimensionGrid">
            <label class="field"><span>長 L</span><span class="inputWithUnit"><input id="L" type="number" value="300" min="20" max="1500" step="0.1" inputmode="decimal"><i>mm</i></span></label>
            <label class="field"><span>寬 W</span><span class="inputWithUnit"><input id="W" type="number" value="180" min="20" max="1500" step="0.1" inputmode="decimal"><i>mm</i></span></label>
            <label class="field"><span>高 H</span><span class="inputWithUnit"><input id="H" type="number" value="200" min="20" max="1500" step="0.1" inputmode="decimal"><i>mm</i></span></label>
          </div>
        </fieldset>

        <fieldset class="paperSelector">
          <legend>紙板預覽</legend>
          <div class="paperToneGroup" role="group" aria-label="紙板預覽顏色">
            <button class="paperTone" type="button" data-paper-tone="kraft" aria-pressed="true"><span class="swatch kraft" aria-hidden="true"></span>牛皮色</button>
            <button class="paperTone" type="button" data-paper-tone="imported" aria-pressed="false"><span class="swatch imported" aria-hidden="true"></span>仿進口色</button>
            <button class="paperTone" type="button" data-paper-tone="white" aria-pressed="false"><span class="swatch white" aria-hidden="true"></span>白色</button>
          </div>
          <p class="paperDisclaimer">紙色僅供螢幕視覺搭配參考，實際紙板與印刷效果以實物為準。</p>
        </fieldset>

        <details id="advancedSettings" class="advancedSettings">
          <summary>進階設定</summary>
          <div class="advancedBody">
            <label class="toggleRow">
              <input id="layoutOverride" type="checkbox">
              <span>本次排版尺寸與標示尺寸不同</span>
            </label>
            <fieldset id="layoutOverrideBox" class="overrideBox" hidden>
              <legend>本次排版尺寸 · mm</legend>
              <div class="layoutDimensions">
                <label class="field"><span>Layout L</span><input id="layoutL" type="number" value="300" min="20" max="1500" step="0.1" inputmode="decimal"></label>
                <label class="field"><span>Layout W</span><input id="layoutW" type="number" value="180" min="20" max="1500" step="0.1" inputmode="decimal"></label>
                <label class="field"><span>Layout H</span><input id="layoutH" type="number" value="200" min="20" max="1500" step="0.1" inputmode="decimal"></label>
              </div>
            </fieldset>
          </div>
        </details>

        <div class="compatibilityControls" hidden>
          <input id="caseCode" value="XC-A1">
          <input id="revision" type="number" value="1">
          <button id="downloadSvg" type="button">下載 SVG</button>
          <button id="downloadJson" type="button">保存案件 JSON</button>
          <button id="importJson" type="button">匯入案件 JSON</button>
          <input id="jsonFile" type="file" accept=".json,application/json">
        </div>
      </section>

      <section class="card previewCard" aria-labelledby="preview-title">
        <div class="previewHeader"><h2 id="preview-title">即時預覽</h2></div>
        <div id="drawing" class="drawing" aria-live="polite"></div>

        <div class="metrics">
          <div class="metric"><small>紙箱尺寸</small><strong id="boxSize">—</strong></div>
          <div class="metric"><small>模板尺寸</small><strong id="totalSize">—</strong></div>
        </div>

        <div class="downloadArea">
          <button id="downloadPdf" class="button primary" type="button">下載 PDF 作圖模板</button>
        </div>
      </section>
    </div>

    <footer>劦成紙箱展開圖 · 紙色為螢幕預覽，實際效果以實物為準</footer>
  </main>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
